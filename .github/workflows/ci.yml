name: Backend CI Pipeline

# Pipelinen körs vid varje push eller Pull Request mot main-branchen
on:
  push:
    branches: main
  pull_request:
    branches:  main

# Least privilege by default; the publish job below adds packages: write
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
# Starta MongoDB i GitHub Actions runner-miljö
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      # 1. Hämta källkoden från GitHub-repot
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Sätt upp Node.js-miljön med caching för npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Installera beroenden exakt enligt package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Statisk kodanalys (Linting)
      - name: Run Linter
        run: npm run lint

      # 5. Kontrollera TypeScript-typer utan att generera filer
      - name: Type Check
        run: npx tsc --noEmit

      # 6. Kör enhetstester (Unit Tests)
      - name: Run Unit Tests
        run: npm run test
      # 6b. Spara täckningsrapporten som artefakt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      # 7. Kör End-to-End-tester (E2E Tests)
      - name: Run E2E Tests
        run: npm run test:e2e

      # 8. Verifiera att NestJS-applikationen går att kompilera/bygga
      - name: Build application
        run: npm run build

      # 9. Verifiera att Docker-imaget går att bygga
      - name: Verify Docker Build
        run: docker build -f Dockerfile.prod -t web-site-backend:ci .
  publish:
    # Build the production image and push it to GitHub Container Registry.
    # Runs only after every check above passed, and only for pushes to main.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # GHCR image names must be lowercase (github.repository has the owner's casing)
      - name: Set image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged with the commit SHA (what gets deployed) and latest (what Terraform
      # points a brand new service at)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    # Runs only if the image was published
    needs: publish
    runs-on: ubuntu-latest
    # Shows up as a "deployment" in GitHub under the repo's Environments
    environment:
      name: production
      url: https://zipfolio-backend-kth.onrender.com
    steps:
      # Image-backed Render services do not redeploy on their own when a new image
      # is pushed. The deploy hook with imgURL tells Render to run this exact SHA.
      - name: Deploy the new image on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.publish.outputs.image }}:${{ github.sha }}
        run: |
          curl --fail --silent --show-error -X POST -G \
            --data-urlencode "imgURL=${IMAGE}" \
            "${RENDER_DEPLOY_HOOK_URL}" > /dev/null
          echo "Requested deploy of ${IMAGE}"
