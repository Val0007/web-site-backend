
# Ändringar i den här filen synkas automatiskt till Render vid merge till main.
services:
  - type: web
    name: web-site-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.prod 
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /      
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false